services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lore
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - lore-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: ["demo-data"]
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:seed"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
      REDIS_URL: redis://redis:6379
      DEMO_MODE: "false"
      LORE_DEPLOYMENT_MODE: local
      API_HOST: 0.0.0.0
      APP_URL: http://localhost:5173
      WEB_ORIGIN: http://localhost:5173
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
      REDIS_URL: redis://redis:6379
      DEMO_MODE: "false"
      LORE_DEPLOYMENT_MODE: local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  lore-postgres:
  lore-redis:

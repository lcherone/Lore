services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lore
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
    ports:
      - "5432:5432"
    volumes:
      - lore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:seed"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
      REDIS_URL: redis://redis:6379
      DEMO_MODE: "false"
      API_HOST: 0.0.0.0
      APP_URL: http://localhost:5173
      WEB_ORIGIN: http://localhost:5173
      LOCAL_DEV_AUTH: "true"
      LOCAL_ORGANISATION_ID: 6f4f5ce6-9038-4ad2-b45e-f6de814555dd
      LOCAL_USER_ID: df9f1efc-1dfe-4df7-b02d-ce228da36e07
      LOCAL_USER_NAME: Casey Hall
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lore:lore@postgres:5432/lore?schema=public
      REDIS_URL: redis://redis:6379
      DEMO_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  lore-postgres:
